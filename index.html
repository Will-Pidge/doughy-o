<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doughy-O</title>
  <meta name="theme-color" content="#ff3d9a">
  <!-- These three lines make it feel like a real app when added to the iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Doughy-O">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<!-- Comic wallpaper: one 560-unit tile (Doughy, POW/BANG/SPLAT bursts, dots, sparks) repeated
     across the page at 420px, shown faintly under the dark wash set in style.css. -->
<svg class="wallpaper" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="dots-pink" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" fill="#ff3d9a"/></pattern>
    <pattern id="dots-ink" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="#111"/></pattern>
    <pattern id="comic-tile" width="420" height="420" patternUnits="userSpaceOnUse">
      <g transform="scale(0.75)">
      <g transform="translate(20,20) scale(0.78)"><polygon points="60,58 75,25 90,58" fill="#3ddc4a" stroke="#111" stroke-width="5"/><polygon points="88,50 100,15 112,50" fill="#3ddc4a" stroke="#111" stroke-width="5"/><polygon points="110,58 125,25 140,58" fill="#3ddc4a" stroke="#111" stroke-width="5"/><circle cx="100" cy="110" r="62" fill="#ff3d9a" stroke="#111" stroke-width="6"/><circle cx="80" cy="100" r="11" fill="#fff"/><circle cx="83" cy="102" r="5" fill="#111"/><circle cx="120" cy="100" r="11" fill="#fff"/><circle cx="123" cy="102" r="5" fill="#111"/><path d="M75 135 Q100 160 125 135" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="62" cy="128" r="7" fill="#ff8ac4"/><circle cx="138" cy="128" r="7" fill="#ff8ac4"/></g>
      <g transform="translate(360,90) rotate(-8)"><polygon points="100.3,-22.3 71.9,-3.0 103.2,13.8 65.6,21.4 82.5,46.7 44.3,40.9 42.9,69.0 12.8,51.0 -6.6,75.5 -21.6,49.5 -54.5,64.6 -51.0,36.6 -90.0,39.0 -68.8,15.3 -104.8,4.4 -70.8,-9.5 -95.7,-31.2 -56.6,-32.1 -64.6,-59.6 -29.4,-47.3 -18.7,-74.4 4.5,-51.7 31.4,-72.1 37.4,-44.3 74.4,-53.3 61.7,-26.7" fill="#ffe21f" stroke="#111" stroke-width="5" stroke-linejoin="round"/><text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Bungee', Impact, sans-serif" font-size="44" fill="#111" stroke="#111" stroke-width="3" paint-order="stroke">POW!</text></g>
      <g transform="translate(230,250) rotate(-12)"><polygon points="95.5,-21.3 78.0,-0.8 96.3,19.3 66.2,29.7 66.6,53.7 33.4,50.7 15.7,71.1 -10.0,55.7 -40.2,65.9 -50.2,43.0 -83.3,39.8 -74.5,16.6 -100.0,1.0 -75.1,-15.0 -84.9,-38.0 -51.9,-41.9 -42.8,-65.1 -12.2,-55.5 12.8,-71.4 31.4,-51.4 64.4,-55.1 65.0,-31.0" fill="#ff3d9a" stroke="#111" stroke-width="5" stroke-linejoin="round"/><text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Bungee', Impact, sans-serif" font-size="34" fill="#fff" stroke="#111" stroke-width="3" paint-order="stroke">SPLAT!</text></g>
      <g transform="translate(370,320) scale(0.66)"><polygon points="60,58 75,25 90,58" fill="#3ddc4a" stroke="#111" stroke-width="5"/><polygon points="88,50 100,15 112,50" fill="#3ddc4a" stroke="#111" stroke-width="5"/><polygon points="110,58 125,25 140,58" fill="#3ddc4a" stroke="#111" stroke-width="5"/><circle cx="100" cy="110" r="62" fill="#ff3d9a" stroke="#111" stroke-width="6"/><circle cx="80" cy="100" r="11" fill="#fff"/><circle cx="83" cy="102" r="5" fill="#111"/><path d="M108 100 Q120 90 132 100" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M75 135 Q100 160 125 135" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="62" cy="128" r="7" fill="#ff8ac4"/><circle cx="138" cy="128" r="7" fill="#ff8ac4"/></g>
      <g stroke="#111" stroke-width="4" stroke-linecap="round"><line x1="330" y1="380" x2="360" y2="380"/><line x1="318" y1="400" x2="356" y2="400"/><line x1="332" y1="420" x2="358" y2="420"/></g>
      <g transform="translate(110,420) rotate(7)"><polygon points="95.5,-21.3 69.9,-1.9 97.5,16.0 61.9,23.5 73.4,48.9 37.3,42.7 29.6,68.8 2.7,50.4 -22.2,70.2 -32.7,44.6 -68.0,52.8 -59.2,26.8 -95.5,21.3 -69.9,1.9 -97.5,-16.0 -61.9,-23.5 -73.4,-48.9 -37.3,-42.7 -29.6,-68.8 -2.7,-50.4 22.2,-70.2 32.7,-44.6 68.0,-52.8 59.2,-26.8" fill="#3ddc4a" stroke="#111" stroke-width="5" stroke-linejoin="round"/><text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="'Bungee', Impact, sans-serif" font-size="38" fill="#111" stroke="#111" stroke-width="3" paint-order="stroke">BANG!</text></g>
      <text transform="translate(275,470) rotate(14)" text-anchor="middle" dominant-baseline="middle" font-family="'Bungee', Impact, sans-serif" font-size="38" fill="#ffe21f" stroke="#111" stroke-width="3" paint-order="stroke">ZAP!</text>
      <circle cx="470" cy="230" r="62" fill="url(#dots-pink)"/><circle cx="90" cy="230" r="46" fill="url(#dots-ink)"/>
      <polygon points="500,400 482,438 500,436 478,486 516,428 498,432" fill="#ffe21f" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
      <polygon transform="translate(300,30) scale(1.2)" points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#3ddc4a" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polygon transform="translate(180,160) scale(0.9)" points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#ffe21f" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polygon transform="translate(520,320) scale(1)" points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#ff3d9a" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polygon transform="translate(60,340) scale(0.8)" points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#3ddc4a" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polygon transform="translate(420,520) scale(1.1)" points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#ffe21f" stroke="#111" stroke-width="2" stroke-linejoin="round"/><polygon transform="translate(250,540) scale(0.8)" points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#ff3d9a" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect width="100%" height="100%" fill="url(#comic-tile)"/>
</svg>
<div id="app">

  <!-- HOME SCREEN -->
  <section class="screen" id="screen-home">
    <div class="logo-wrap">
      <h1 class="logo">DOUGHY-O</h1>
      <div class="burst burst-yellow">DAILY<br>BRAIN<br>SPLAT!</div>
    </div>
    <div class="doughy-wrap">
      <div class="bubble" id="home-bubble">Ready for today's riddle?</div>
      <div class="doughy" id="doughy"></div>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="stat-streak">0</span><span class="stat-label">day streak</span></div>
      <div class="stat"><span class="stat-num" id="stat-level">Egg</span><span class="stat-label">level</span></div>
      <div class="stat"><span class="stat-num" id="stat-best">0</span><span class="stat-label">best streak</span></div>
    </div>
    <button class="big-btn" id="btn-play">PLAY TODAY'S PUZZLE</button>
    <div class="row">
      <button class="big-btn alt" data-practice="riddles">MORE RIDDLES</button>
      <button class="big-btn alt" data-practice="maths">MORE MATHS</button>
    </div>
    <p class="small" id="home-note"></p>
  </section>

  <!-- PUZZLE SCREEN (used for both riddle and maths) -->
  <section class="screen hidden" id="screen-puzzle">
    <div class="topbar">
      <span class="tag" id="puzzle-tag">RIDDLE</span>
      <span class="tag tag-dark" id="puzzle-points">3 pts</span>
    </div>
    <div class="doughy-wrap small-doughy">
      <div class="bubble bubble-q" id="puzzle-q">...</div>
      <div class="doughy" id="doughy2"></div>
    </div>
    <ul class="clues" id="clues"></ul>
    <form id="answer-form" autocomplete="off">
      <input type="text" id="answer-input" placeholder="Type your answer..." autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="submit" class="big-btn">ANSWER!</button>
    </form>
    <button class="ghost-btn" id="btn-clue">🔍 Give me a clue (costs a point)</button>
    <div class="feedback hidden" id="feedback"></div>
    <div class="row hidden" id="practice-nav">
      <button class="big-btn" id="btn-next">NEXT ONE!</button>
      <button class="ghost-btn" id="btn-stop">I'm done</button>
    </div>
  </section>

  <!-- JOKE SCREEN -->
  <section class="screen hidden" id="screen-joke">
    <div class="topbar"><span class="tag">JOKE TIME</span></div>
    <div class="doughy-wrap">
      <div class="bubble bubble-q" id="joke-setup">...</div>
      <div class="doughy" id="doughy3"></div>
    </div>
    <button class="big-btn" id="btn-punch">🥁 TELL ME!</button>
    <div class="burst burst-green hidden" id="joke-punch"></div>
    <button class="big-btn hidden" id="btn-finish">SEE MY SCORE</button>
  </section>

  <!-- SUMMARY SCREEN -->
  <section class="screen hidden" id="screen-summary">
    <h2 class="logo small-logo" id="summary-title">CRASH!</h2>
    <div class="scorecard">
      <div class="scorecard-row"><span>Riddle</span><b id="sum-riddle">0</b></div>
      <div class="scorecard-row"><span>Maths</span><b id="sum-maths">0</b></div>
      <div class="scorecard-row total"><span>Today</span><b id="sum-total">0</b></div>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="sum-streak">0</span><span class="stat-label">day streak</span></div>
      <div class="stat"><span class="stat-num" id="sum-level">Egg</span><span class="stat-label">level</span></div>
      <div class="stat"><span class="stat-num" id="sum-alltime">0</span><span class="stat-label">all-time pts</span></div>
    </div>
    <p class="small" id="sum-note">Come back tomorrow for a new one!</p>
    <div class="row">
      <button class="big-btn alt" data-practice="riddles">MORE RIDDLES</button>
      <button class="big-btn alt" data-practice="maths">MORE MATHS</button>
    </div>
    <button class="ghost-btn" id="btn-home">Back to start</button>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
